<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Extrovert: visual prototype</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="tour-open" data-theme="light">

  <!-- Simulated OS menu bar (tray icon lives here) -->
  <header class="menubar">
    <div class="mb-left"><b></b><strong>Extrovert</strong><span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span></div>
    <div class="mb-right">
      <button class="tray-btn" id="tray-btn" aria-label="Extrovert menu-bar mini view">
        <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="9" cy="12" r="5.4" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="15" cy="12" r="5.4" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
      </button>
      <span id="clock"></span>
    </div>
  </header>

  <!-- Native OS notifications appear outside the app window -->
  <div id="os-toasts" aria-live="polite"></div>

  <!-- The Extrovert window -->
  <div class="window" id="win">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="main">
      <div class="share-banner" id="share-banner"><i class="rec"></i>Sharing your screen from Meet (Work) · <b>Shield on:</b> previews & other workspaces hidden<button data-act="stop-share">Stop sharing</button></div>
      <div class="view" id="view"></div>
      <div id="view-overlay"></div>
      <div class="mock-tag" id="mock-tag"></div>
      <div class="findbar" id="findbar"></div>
      <aside class="nc" id="nc" aria-label="Notification center"></aside>
    </section>
    <div id="modal-root"></div>
    <div id="palette-root"></div>
    <div id="onboarding-root"></div>
    <div id="lock-root"></div>
    <div id="snack-root"></div>
  </div>

  <!-- Floating layers -->
  <div id="tooltip" role="tooltip"></div>
  <div id="peek"></div>
  <div id="ctx"></div>
  <div id="popover"></div>
  <div id="call-bubble"></div>
  <div class="dock" id="dock"></div>

  <button class="tour-btn" data-act="tour">✦ Feature tour</button>
  <aside class="tour" id="tour"></aside>

  <script src="js/data.js"></script>
  <script src="js/mocks.js"></script>
  <script src="js/app.js"></script>
  <script src="js/features.js"></script>
</body>
</html>
