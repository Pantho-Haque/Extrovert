# The only workflow: nothing runs on a normal push.
#
# Publish a release: push a version tag that matches "version" in package.json.
#   git tag v0.1.0 && git push origin v0.1.0        → a normal release (everyone gets it)
#   git tag v0.2.0-beta.1 && git push origin …       → a pre-release (only the Beta update channel)
# Tests run once (on Linux, the cheapest runner); then each system builds its own installers into a
# draft release, which is published once every build succeeded.
#
# Rebuild one system without paying for the others (e.g. after a Linux-only fix): Actions → Release →
# Run workflow → pick the branch and the system. It uploads to the release for package.json's version.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      only:
        description: Build only this system
        type: choice
        options: [all, macos, windows, linux]
        default: all

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Google sign-in secrets are set
        env:
          ID: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_ID }}
          SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}
        run: |
          [ -n "$ID" ] && [ -n "$SECRET" ] || { echo "::error::Add MAIN_VITE_GOOGLE_CLIENT_ID and MAIN_VITE_GOOGLE_CLIENT_SECRET under Settings → Secrets and variables → Actions. Without them the app can't sign in."; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Release tag
        id: tag
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($tag)"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create the draft release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "Extrovert ${TAG#v}" --generate-notes --target "$GITHUB_SHA" \
              $([[ "$TAG" == *-* ]] && echo --prerelease)

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.only == 'macos' && '["macos-latest"]' || inputs.only == 'windows' && '["windows-latest"]' || inputs.only == 'linux' && '["ubuntu-latest"]' || '["macos-latest","windows-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          # Google sign-in, from the repository's Actions secrets (Settings → Secrets and variables → Actions).
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.MAIN_VITE_GOOGLE_CLIENT_SECRET }}
        run: pnpm build && pnpm exec electron-builder --publish always

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.draft.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false
