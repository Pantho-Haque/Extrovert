# Installers for GitHub Releases. Built by .github/workflows/release.yml when a v* tag is pushed;
# locally: `pnpm dist` (current system only, nothing published).
appId: io.github.panthohaque.extrovert
productName: Extrovert
copyright: Copyright © 2026 Pantho Haque

directories:
  buildResources: resources
  output: release

files:
  - out/**
  - resources/**
  - package.json
# The app reads its icons from resources/ with native APIs, which can't look inside app.asar.
asarUnpack:
  - resources/**
# Chromium's own UI text (context menus, date pickers) in these languages only; the rest fall back to
# English. Websites are unaffected. Saves about 45 MB per install.
# Windows and Linux spell regional variants with "-" (zh-CN), macOS with "_" (zh_CN), so both are listed.
electronLanguages: [en, en-GB, en_GB, bn, hi, ur, ar, zh-CN, zh_CN, zh-TW, zh_TW, ja, ko, es, es-419, es_419, fr, de, it, pt-BR, pt_BR, pt-PT, pt_PT, ru, tr, id, ms, vi, th, nl, pl]

# Stable file names (no version), so the website and README can link to
# https://github.com/Pantho-Haque/Extrovert/releases/latest/download/<name>
mac:
  icon: resources/icon.png
  category: public.app-category.social-networking
  # One app per kind of Mac, half the size of a universal one. The zips feed the update check.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  artifactName: Extrovert-mac-${arch}.${ext}
  # Not signed with a paid Apple certificate yet: ad-hoc signed, so macOS asks once on first open.
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSCameraUsageDescription: Services you add (WhatsApp, Meet, Messenger…) can use your camera for calls.
    NSMicrophoneUsageDescription: Services you add (WhatsApp, Meet, Messenger…) can use your microphone for calls.
dmg:
  title: Extrovert
  format: ULFO # LZFSE: smaller than the default zlib, and quick to open

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: x64
  artifactName: Extrovert-Setup.${ext}
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Extrovert

linux:
  icon: resources/icon.png
  category: Network;InstantMessaging;
  synopsis: All your communities. One space.
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  artifactName: Extrovert-linux.${ext}
deb:
  # .deb installs can't update themselves; the app tells you and links the new one instead.
  packageName: extrovert
  # Required by .deb. A GitHub no-reply address: installer metadata is public.
  maintainer: Pantho Haque <Pantho-Haque@users.noreply.github.com>

publish:
  provider: github
  owner: Pantho-Haque
  repo: Extrovert
  releaseType: draft
